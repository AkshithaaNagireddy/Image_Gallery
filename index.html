<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Background Blur Orbs -->
  <div class="glass-bg-orb orb-1"></div>
  <div class="glass-bg-orb orb-2"></div>

  <div class="gallery-container">
    <header>
      <h1>Interactive Image Gallery</h1>
      <p>Filter by category or click any image for full-screen preview and navigation</p>
    </header>

    <!-- Category Filter Controls -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="nature">Nature</button>
      <button class="filter-btn" data-filter="architecture">Architecture</button>
      <button class="filter-btn" data-filter="technology">Technology</button>
    </div>

    <!-- Image Grid Container -->
    <div class="gallery-grid" id="gallery-grid">
      <!-- Rendered via JavaScript -->
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev">&#10094;</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next">&#10095;</button>
    
    <div class="lightbox-content">
      <img src="" alt="" id="lightbox-img">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
